<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude's Kitchen</title>
<link rel="icon" href="/kitchen.ico?v=1" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9dcc8; --cream: #fffaf1; --ticket: #fdf6e8; --ink: #3a2a20; --dim: #7a6354; --rule: rgba(58,42,32,.16);
    --tomato: #c8392b; --claude: #d97757; --sage: #7f9a78; --butter: #f2d27a; --copper: #b8703f; --steel: #9aa3a6;
    --display: 'Fredoka', 'Nunito', system-ui, sans-serif; --sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 10px 28px rgba(70,40,20,.22), 0 2px 6px rgba(70,40,20,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  #scene, #labels { position: fixed; inset: 0; }
  #labels { pointer-events: none; }
  h1, h2, p, ol { margin: 0; padding: 0; }

  .hud { position: fixed; z-index: 5; pointer-events: none; }
  .card { background: var(--cream); color: var(--ink); padding: 16px 18px; border-radius: 18px; box-shadow: var(--shadow); }
  .card h2 { display: flex; align-items: center; gap: 8px; font: 600 13px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
  .card h2::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--claude); flex: none; }

  /* order ticket */
  #tl { top: 22px; left: 22px; width: min(370px, calc(100vw - 44px)); background: var(--ticket); padding-top: 20px;
    background-image: radial-gradient(circle at 10px 0, var(--bg) 6px, transparent 6.5px); background-size: 20px 12px; background-repeat: repeat-x; background-position: -2px 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 2px dashed var(--rule); }
  .brand h1 { font: 700 26px/1 var(--display); letter-spacing: -.01em; color: var(--ink); }
  .brand h1 em { font-style: normal; color: var(--claude); }
  #dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--dim); flex: none; }
  #dot.on { background: var(--sage); border-color: var(--sage); box-shadow: 0 0 0 4px rgba(127,154,120,.25); }
  .sub { font: 500 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-top: 10px; }
  .case { margin-top: 8px; font: 600 18px/1.3 var(--display); }
  #project { font-size: 12px; color: var(--dim); margin-top: 4px; }
  #stamp { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 5px 12px 4px; font: 700 14px/1 var(--display); letter-spacing: .08em; text-transform: uppercase;
    color: var(--cream); background: var(--sage); border-radius: 999px; }
  #stamp[hidden] { display: none; }
  #stamp.burnt { background: var(--tomato); }
  #stamp.ask { background: var(--butter); color: var(--ink); animation: s-pulse 1.6s ease-in-out infinite; }
  @keyframes s-pulse { 50% { box-shadow: 0 0 0 6px rgba(242,210,122,.45); } }

  /* buttons */
  #cams { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  #cams button, #ccPick button, #cctv button, #qbtn {
    pointer-events: auto; font: 600 12px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--ink);
    background: rgba(58,42,32,.06); border: 0; padding: 9px 12px; min-height: 34px; cursor: pointer; border-radius: 999px;
  }
  #cams button:hover, #ccPick button:hover, #qbtn:hover { background: rgba(217,119,87,.16); }
  #cams button[aria-pressed="true"], #ccPick button[aria-pressed="true"] { background: var(--claude); color: #fff; }
  #cams button:focus-visible, #ccPick button:focus-visible, #qbtn:focus-visible, #cctv button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  #qbtn { margin-left: auto; padding: 6px 10px; min-height: 28px; font-size: 11px; }
  #ccPick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  #ccPick[hidden] { display: none; }

  /* overlays on the picture itself */
  #cctv, #freeHint { position: fixed; z-index: 4; top: 84px; left: 50%; transform: translateX(-50%); font: 500 13px var(--sans); color: var(--ink);
    background: rgba(255,250,241,.88); padding: 6px 12px; border-radius: 999px; box-shadow: 0 4px 14px rgba(70,40,20,.18); white-space: nowrap; }
  #cctv { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
  #cctv[hidden], #freeHint[hidden] { display: none; }
  #freeHint { pointer-events: none; }
  #cctv button { padding: 6px 10px; min-height: 30px; }
  #cctv .rec { color: var(--tomato); font-weight: 700; }

  /* now-line */
  #now { top: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; padding: 10px 18px; border-radius: 999px; font-size: 14px; white-space: nowrap; max-width: min(560px, calc(100vw - 860px)); min-width: 220px; }
  #now b { font: 700 11px/1 var(--display); letter-spacing: .12em; color: #fff; background: var(--claude); padding: 5px 8px 4px; border-radius: 999px; flex: none; }
  #now span { overflow: hidden; text-overflow: ellipsis; }
  #now.alert { background: var(--butter); }
  #now.alert b { background: var(--tomato); }

  /* the tab */
  #tr { width: 256px; font-size: 13px; }
  .row { display: flex; align-items: baseline; gap: 6px; padding: 4px 0; font-variant-numeric: tabular-nums; }
  .row span { white-space: nowrap; }
  .row i { flex: 1; border-bottom: 2px dotted var(--rule); transform: translateY(-3px); }
  .row b { font-weight: 700; }
  .row.total { font: 600 16px var(--display); padding-bottom: 8px; margin-bottom: 4px; border-bottom: 2px dashed var(--rule); }
  .row.total b { color: var(--claude); }
  .row.bad b { color: var(--tomato); }
  #limits, #jobs { margin-top: 12px; padding-top: 12px; border-top: 2px dashed var(--rule); }
  #limits[hidden], #jobs[hidden] { display: none; }
  .dials { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dial { text-align: center; }
  .dial svg { display: block; width: 100%; max-width: 104px; margin: 0 auto; overflow: visible; }
  .dial .track { fill: none; stroke: rgba(58,42,32,.1); stroke-width: 9; stroke-linecap: round; }
  .dial .fill { fill: none; stroke: var(--sage); stroke-width: 9; stroke-linecap: round; }
  .dial.low .fill { stroke: var(--tomato); }
  .dial .needle { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; transition: transform .6s cubic-bezier(.3,1.5,.5,1); transform-origin: 50px 50px; }
  .dial .hub { fill: var(--copper); }
  .dial b { display: block; font: 600 14px/1.1 var(--display); margin-top: 2px; }
  .dial.low b { color: var(--tomato); }
  .dial span, .dial small { display: block; font-size: 11px; color: var(--dim); }

  /* ticket rail */
  #notes { bottom: 22px; left: 22px; width: min(380px, calc(100vw - 44px)); padding-top: 0; overflow: hidden; }
  #notes[hidden] { display: none; }
  #notes::before { content: ''; display: block; height: 8px; margin: 0 -18px 12px; background: linear-gradient(var(--steel), #c9cfd1 60%, #858d90); }
  #noteList { list-style: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: 5px; } /* rows may not grow past the card */
  #noteList li { min-width: 0; display: flex; gap: 10px; align-items: baseline; font-size: 13px; line-height: 1.35; white-space: nowrap; padding: 4px 10px; background: var(--ticket); border-radius: 8px; border-left: 3px solid var(--butter); }
  #noteList li span { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  #noteList li time { flex: none; margin-left: auto; padding-left: 8px; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #noteList li:nth-child(n+4) { opacity: .7; }
  #noteList li:nth-child(n+6) { opacity: .5; }
  #noteList li.bad { border-left-color: var(--tomato); background: #fbe9e4; }
  #noteList li.bad span { color: var(--tomato); font-weight: 500; }

  /* key */
  #legend { width: 256px; min-height: 0; overflow: hidden; flex: 0 1 auto; }
  /* the tab grows when jobs appear: stack it and the key in one column so they can't overlap */
  #rcol { position: fixed; z-index: 5; top: 22px; right: 22px; bottom: 22px; display: flex; flex-direction: column; gap: 14px; pointer-events: none; }
  #rcol > .hud { position: static; flex: none; }
  #rcol > #legend { flex: 0 1 auto; }
  #legend dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; align-items: baseline; }
  #legend dt { font: 600 12px var(--display); }
  #legend dd { margin: 0; font-size: 12px; color: var(--dim); }
  #legend .red { color: var(--tomato); }

  /* the chef's spoken line, a speech bubble */
  #caption { bottom: 36px; left: 50%; transform: translateX(-50%); width: min(620px, calc(100vw - 860px)); text-align: center; }
  #caption:not(:empty) { font: 500 18px/1.35 var(--display); color: var(--ink); background: var(--cream); padding: 10px 18px; border-radius: 18px; box-shadow: var(--shadow); }

  /* in-scene labels */
  .bot-name { font: 600 12px var(--display); color: var(--ink); background: rgba(255,250,241,.9); padding: 2px 8px; border-radius: 999px; white-space: nowrap; box-shadow: 0 2px 6px rgba(70,40,20,.2); }
  .float { font: 600 13px var(--display); color: var(--ink); background: var(--cream); padding: 4px 11px; border-radius: 999px; white-space: nowrap; max-width: 360px; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 4px 12px rgba(70,40,20,.28); }
  .float.red { background: var(--tomato); color: #fff; letter-spacing: .04em; }

  @media (max-width: 1279px) {
    #legend { display: none; }
    #now { top: auto; bottom: 22px; left: auto; right: 22px; transform: none; max-width: calc(100vw - 446px); }
    #caption { bottom: 84px; left: auto; right: 22px; transform: none; width: calc(100vw - 446px); text-align: right; }
    #cctv, #freeHint { top: 22px; left: auto; right: 300px; transform: none; }
  }
  @media (max-width: 899px) {
    #tr, #notes, #caption, #legend { display: none; }
    #tl { top: 12px; left: 12px; width: calc(100vw - 24px); padding: 16px 14px 12px; }
    #now { bottom: 12px; left: 12px; right: 12px; max-width: none; min-width: 0; }
    #cctv, #freeHint { top: auto; bottom: 64px; left: 50%; right: auto; transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

} }
</script>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>

<section class="hud card" id="tl" aria-label="Order ticket">
  <div class="brand"><span id="dot" title="Live feed"></span><h1>Claude's <em>Kitchen</em></h1><button id="qbtn" type="button" aria-label="Toggle render quality" aria-pressed="true">HIGH</button></div>
  <p class="sub">Order ticket</p>
  <p class="case" id="title">No orders yet</p>
  <p id="project">—</p>
  <div id="stamp" role="status" hidden></div>
  <div id="cams" role="group" aria-label="Camera">
    <button type="button" data-cam="orbit" title="Key 1">1 Kitchen</button>
    <button type="button" data-cam="follow" title="Key 2. Drag to turn, scroll to zoom; press again to go back behind them">2 Follow</button>
    <button type="button" data-cam="cctv" title="Key 3: pick a station camera">3 CCTV</button>
    <button type="button" data-cam="free" title="Key 4">4 Free</button>
  </div>
  <div id="ccPick" role="group" aria-label="Choose a station camera" hidden></div>
</section>
<div id="freeHint" hidden>WASD move · drag to look · E / Q up / down · Shift faster · scroll sets speed</div>
<div id="cctv" hidden><button type="button" id="ccPrev" aria-label="Previous camera">‹</button><span id="ccName"></span><span class="rec">● REC</span><span id="ccTime"></span><button type="button" id="ccNext" aria-label="Next camera">›</button></div>

<div class="hud card" id="now"><b>NOW</b><span>waiting for an order</span></div>

<div id="rcol">
<section class="hud card" id="tr" aria-label="The tab">
  <h2>The tab</h2>
  <div class="row total"><span>Bill (est.)</span><i></i><b id="sCost">—</b></div>
  <div class="row"><span>Words out</span><i></i><b id="sTok">0</b></div>
  <div class="row"><span>Tools used</span><i></i><b id="sTools">0</b></div>
  <div class="row"><span>Files fetched</span><i></i><b id="sFiles">0</b></div>
  <div class="row"><span>Files chopped</span><i></i><b id="sEdits">0</b></div>
  <div class="row bad"><span>Burnt</span><i></i><b id="sFails">0</b></div>
  <div id="limits" hidden></div>
  <div id="jobs" hidden></div>
</section>

<section class="hud card" id="notes" aria-label="Ticket rail" hidden><h2>Ticket rail</h2><ol id="noteList"></ol></section>
<section class="hud card" id="legend" aria-label="Key"><h2>Key</h2><dl id="legendList"></dl></section>
</div>
<div class="hud" id="caption" role="status"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
// ==================== world.js ====================
// ================= WORLD (agent A): Claude's Kitchen, a clay miniature =================
const $ = s => document.querySelector(s);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const damp = (a, b, k, dt) => a + (b - a) * Math.min(1, dt * k);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = u => { u = clamp(u); return u * u * (3 - 2 * u); };
const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
let w_seed = 4747;
const rnd = (a = 0, b = 1) => { w_seed = (w_seed + 0x6D2B79F5) | 0; let t = Math.imul(w_seed ^ (w_seed >>> 15), 1 | w_seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return a + (((t ^ (t >>> 14)) >>> 0) / 4294967296) * (b - a); };
const hashS = s => { let h = 7; for (const c of String(s)) h = Math.imul(h, 31) + c.charCodeAt(0) | 0; return Math.abs(h); };
const W_FONT = "'Fredoka', 'Trebuchet MS', sans-serif";

// ---------- renderer, camera, post ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
// VSM gives the wide, soft studio shadows a clay set needs; PCF edges read as CG
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap; renderer.shadowMap.autoUpdate = false; renderer.shadowMap.needsUpdate = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
$('#scene').appendChild(renderer.domElement);
const labels = new CSS2DRenderer(); labels.setSize(innerWidth, innerHeight); $('#labels').appendChild(labels.domElement);
const W_BG = 0xe8d5bd;
const scene = new THREE.Scene(); scene.background = new THREE.Color(W_BG); scene.fog = new THREE.Fog(W_BG, 28, 62);
const ROOM_TARGET = V(0, .4, -.1), CAM_START = V(0, 10.6, 14.4);
const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, .1, 160); camera.position.copy(CAM_START);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(ROOM_TARGET); controls.enableDamping = true;
// the set is open toward +z only, so the camera stays on that side
controls.minAzimuthAngle = -.85; controls.maxAzimuthAngle = .85; controls.minPolarAngle = .2; controls.maxPolarAngle = 1.38; controls.minDistance = 2; controls.maxDistance = 34;
controls.update();
const W_VS = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }';
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType }));
composer.addPass(new RenderPass(scene, camera));
// bloom smears a NaN pixel into a black square, so clamp first
composer.addPass(new ShaderPass({ uniforms: { tDiffuse: { value: null } }, vertexShader: W_VS,
  fragmentShader: 'uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb; gl_FragColor = vec4(min(max(c, vec3(0.)), vec3(48.)), 1.); }' }));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .28, .55, .95); composer.addPass(bloom);
composer.addPass(new OutputPass());
const w_smaa = new SMAAPass(innerWidth * renderer.getPixelRatio(), innerHeight * renderer.getPixelRatio()); composer.addPass(w_smaa);
// tilt-shift: a sharp band across the middle, a golden-angle disc blur growing toward top and bottom
const w_tilt = new ShaderPass({ uniforms: { tDiffuse: { value: null }, px: { value: new THREE.Vector2(1 / innerWidth, 1 / innerHeight) }, amt: { value: 1 }, mid: { value: .46 }, band: { value: .1 } }, vertexShader: W_VS,
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 px; uniform float amt, mid, band; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      float r = amt * 8. * smoothstep(band, band + .34, abs(vUv.y - mid));
      if (r < .3) { gl_FragColor = vec4(c, 1.); return; }
      vec3 acc = c; float w = 1.;
      for (int i = 0; i < 20; i++) { float a = float(i) * 2.39996, rr = sqrt(float(i) + .5) / 4.5; acc += texture2D(tDiffuse, vUv + vec2(cos(a), sin(a)) * rr * r * px).rgb; w += 1.; }
      gl_FragColor = vec4(acc / w, 1.);
    }` });
composer.addPass(w_tilt);
const grade = new ShaderPass({ uniforms: { tDiffuse: { value: null }, time: { value: 0 }, calm: { value: CALM ? 1 : 0 }, cctv: { value: 0 }, tilt: w_tilt.uniforms.amt }, vertexShader: W_VS,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time, calm, cctv; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      float l = dot(c, vec3(.299, .587, .114));
      c = mix(vec3(l), c, 1.07) * vec3(1.03, 1.0, .95) + vec3(.022, .012, 0.) * (1. - l); // warm grade, shadows lifted toward honey
      vec2 d = vUv - .5; c *= mix(.8, 1., smoothstep(.86, .28, length(d * vec2(1.1, 1.))));
      if (cctv > .5) c = vec3(dot(c, vec3(.33))) * vec3(1., .97, .9) * (.93 + .07 * sin(vUv.y * 700. + time * 24.));
      gl_FragColor = vec4(c, 1.);
    }` });
composer.addPass(grade);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight); w_tilt.uniforms.px.value.set(1 / innerWidth, 1 / innerHeight); });

// ---------- building blocks ----------
function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (rx !== 1 || ry !== 1) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); }
  return Object.assign(t, { g, redraw() { draw(g, w, h); t.needsUpdate = true; } });
}
// thumb smudges, fingerprint whorls and pits: the bump every clay surface shares
const w_clayTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 90; i++) { const x = rnd(0, w), y = rnd(0, h), r = rnd(18, 70), b = g.createRadialGradient(x, y, 0, x, y, r), v = rnd() > .5 ? 255 : 0; b.addColorStop(0, `rgba(${v},${v},${v},${rnd(.05, .12)})`); b.addColorStop(1, `rgba(${v},${v},${v},0)`); g.fillStyle = b; g.fillRect(x - r, y - r, r * 2, r * 2); }
  for (let i = 0; i < 16; i++) { const x = rnd(0, w), y = rnd(0, h), a = rnd(0, 3); g.save(); g.translate(x, y); g.rotate(a); g.lineWidth = 1.2;
    for (let k = 1; k < 14; k++) { g.strokeStyle = `rgba(${k % 2 ? 255 : 0},${k % 2 ? 255 : 0},${k % 2 ? 255 : 0},.07)`; g.beginPath(); g.ellipse(0, 0, k * 3.2, k * 2.3, 0, rnd(0, 1), rnd(4.5, 6.2)); g.stroke(); } g.restore(); }
  for (let i = 0; i < 1800; i++) { g.fillStyle = `rgba(0,0,0,${rnd(.05, .2)})`; g.beginPath(); g.arc(rnd(0, w), rnd(0, h), rnd(.6, 1.8), 0, 7); g.fill(); }
});

  s_queue.push(ev);
}
window.__feed = ingest; // replay (extras.js) hands events in here

// ---------- loop ----------
const s_clock = new THREE.Clock();
let s_lastDraw = 0, s_frameN = 0;
// coffee after a turn, the flour sacks after 2 min, the pass (watching the rail) while background jobs cook
function s_restFor(now) {
  const free = !chef.cur && !chef.tasks.length; if (!free) return null;
  const turnOver = (!s_turnOpen || Date.now() - s_lastEvAt >= s_STALE) && !s_mainRunning() && (s_chefDone || Date.now() - s_lastEvAt > 8000);
  if (!turnOver) { s_idleSince = 0; return null; }
  s_idleSince ||= now;
  if (s_bgLive() || now < s_bgGraceUntil) return s_S('pass');
  return now - s_idleSince > s_NAP ? s_S('flour') : s_S('coffee');
}
function frame() {
  requestAnimationFrame(frame);
  const stamp = performance.now(), idle = !s_queue.length && !chef.cur && !chef.tasks.length && !workers.size;
  if (stamp - s_lastDraw < (idle ? 32 : 15.5)) return;
  s_lastDraw = stamp; s_frameN++;
  const dt = Math.min(s_clock.getDelta(), .05), t = s_clock.elapsedTime, now = performance.now();
  while (s_queue.length && now >= s_nextAt) { const ev = s_queue.shift(); s_live(ev); s_nextAt = now + (s_queue.length > 25 ? 25 : ev.k === 'result' || ev.k === 'usage' ? 0 : 150); }
  chef.rest = s_restFor(now);
  if (s_turnOpen && !s_mainRunning() && !chef.cur && !chef.tasks.length && Date.now() - s_lastEvAt < s_STALE) chef.thinkUntil = Math.max(chef.thinkUntil || 0, now + 400);
  worldTick(dt, t, now); // runs the fx list too
  chef.update(dt, now);
  let crew = 0; for (const w of workers.values()) if (!w.leaving) crew++;
  for (const [id, w] of workers) {
    w.update(dt, now);
    const idleW = !w.leaving && !w.cur && !w.tasks.length;
    if (idleW && !w.rest && w.idleT > 1.5) {
      if (!w.s_desk) { w.s_desk = PREP.find(s => !s.who) || s_WAIT.find(s => !s.who) || null; if (w.s_desk) w.s_desk.who = w; }
      w.rest = w.s_desk;
    }
    if (idleW && crew > s_CREW_CAP && w.s_rec?.over !== false) { crew--; s_sendAway(w); }
    else if (idleW && !w.s_rec && w.idleT > 180) s_sendAway(w); // no spawn on record (joined after a reload): nobody will tell us it's done
    if (w.gone) { if (camSubj === w) { camSubj = chef; followSnap = true; } w.dispose(); workers.delete(id); }
  }
  const sd = STATIONS.staffDoor;
  if (s_door && sd?.inside && sd.outside) { s_doorK = damp(s_doorK, allPeople().some(p => Math.min(p.R.position.distanceTo(sd.inside), p.R.position.distanceTo(sd.outside)) < 1.4) ? 1 : 0, 5, dt); s_door.open(s_doorK); }
  s_steam?.(dt, t);
  if (now > s_capUntil && $('#caption').textContent) $('#caption').textContent = '';
  if (now > s_nowUntil) { const s = s_restStatus(); if ($('#now span').textContent !== s) $('#now span').textContent = s; }
  if (camMode === 'orbit') s_orbit(dt); else updateCam(dt, now);
  composer.render();
  if (idle || s_frameN % 2) labels.render(scene, camera);
}
s_paintQ();
try { const m = localStorage.getItem('kitchen-cam'); if (m && m !== 'orbit' && CAM_FOV[m]) setCam(m); } catch {}
s_renderNotes(); s_renderStats(); requestAnimationFrame(frame);

// ---------- data source ----------
const s_params = new URLSearchParams(location.search);
if (s_params.has('demo')) s_demo();
else if (!s_params.has('replay')) {
  const es = new EventSource('/events');
  es.onopen = () => $('#dot').classList.add('on');
  es.onmessage = m => { try { ingest(JSON.parse(m.data)); } catch (e) { console.error(e); } };
  es.onerror = () => $('#dot').classList.remove('on');
}

// a scripted service that walks every kind of event: prompt, think, say, every tool family, failures, git commit/push,
// skill, connector, a sync and an async crew member, a background job, a permission prompt, usage, cost, limits, end
function s_demo() {
  $('#dot').classList.add('on');
  const wait = ms => new Promise(r => setTimeout(r, ms)), feed = ev => ingest({ ...ev, t: Date.now() });
  let n = 0, spent = 0, five = 22, week = 48;
  const tool = async (d, ms = 1100, err = false, ag) => { const id = 'd' + (++n); feed({ k: 'tool', id, ...d, ...(ag ? { ag } : {}) }); await wait(ms); feed({ k: 'result', id, err }); await wait(500 + Math.random() * 700); };
  const R = f => ({ name: 'Read', cat: 'read', label: 'Read', file: f }), E = f => ({ name: 'Edit', cat: 'edit', label: 'Edit', file: f });
  const B = (label, cmd) => ({ name: 'Bash', cat: 'shell', label, cmd }), G = p => ({ name: 'Grep', cat: 'search', label: 'Grep ' + p, dir: 'web/lib' });
  const W = q => ({ name: 'WebSearch', cat: 'web', label: q }), SK = s => ({ name: 'Skill', cat: 'other', label: 'skill · ' + s, skill: s });
  const MCP = (a, b) => ({ name: `mcp__${a}__${b}`, cat: 'other', label: `${a} · ${b}` }), SPAWN = label => ({ name: 'Agent', cat: 'agent', label, spawn: true });
  const ORDERS = [
    { title: 'Bilingual login, extra tests on the side', prompt: 'make the login page bilingual and add tests', a: 'audit the route guards', b: 'review the Arabic copy',
      files: ['web/app/login/page.tsx', 'web/lib/auth/route-guard.ts', 'web/messages/en.json', 'web/messages/ar.json', 'admin/components/nav.tsx'] },
    { title: 'The checkout that sends you back', prompt: 'users get bounced to /login after paying, find out why', a: 'trace the payment webhook', b: 'check the session cookie',
      files: ['web/app/checkout/route.ts', 'web/lib/session.ts', 'supabase/functions/webhook/index.ts', 'web/middleware.ts', 'README.md'] },
    { title: 'Owner notes, slow-cooked migration', prompt: 'add an owner_notes column and backfill it', a: 'find every reader of owners', b: 'write the backfill test',
      files: ['supabase/migrations/0130_owner_notes.sql', 'web/lib/owners.ts', 'web/app/owners/[id]/page.tsx', 'docs/progress-log.md', 'web/lib/db.ts'] },
  ];
  setInterval(() => { feed({ k: 'usage', out: 60 + Math.round(Math.random() * 400) }); spent += .004 + Math.random() * .012; feed({ k: 'cost', usd: spent }); }, 1600);
  const lim = () => { five = Math.min(96, five + 1.7); week = Math.min(99, week + .3); ingest({ k: 'limits', five: { used: five, resets: new Date(Date.now() + 2.4 * 36e5).toISOString() }, week: { used: week, resets: new Date(Date.now() + 3.5 * 864e5).toISOString() }, at: Date.now() }); };
  lim(); setInterval(lim, 20000);
  const crewRun = async (ag, steps) => { for (const [d, err] of steps) await tool(d, 1300, err, ag); };
  feed({ k: 'project', name: 'demo' });
  (async () => {
    for (let round = 0; ; round++) {
      const c = ORDERS[round % ORDERS.length], f = c.files, burnt = round % 3 === 2;
      feed({ k: 'title', text: c.title }); feed({ k: 'prompt', text: c.prompt }); await wait(4000);
      feed({ k: 'think' }); await wait(1800); feed({ k: 'say', text: 'Right, mise en place first. Fetch me those files.' }); await wait(1200);
      await tool(R(f[0])); await tool(G('createClient')); await tool(R(f[1])); await tool(W('next-intl middleware docs'));
      const bgId = 'bash' + round; await tool(B('Build in the background', 'npm run build')); feed({ k: 'bg', id: bgId, label: 'Build in the background' });
      setTimeout(() => feed({ k: 'bgdone', id: bgId, status: round % 2 ? 'failed' : 'completed' }), 14000);
      await tool(E(f[1])); await tool(B('Run the tests', 'npm test -- ' + s_baseName(f[1])), 1800, true);
      feed({ k: 'say', text: 'Too much heat on that one. Turn it down and go again.' }); await wait(1500);
      const sync = 'd' + (++n); feed({ k: 'tool', id: sync, ...SPAWN(c.a) });
      const agA = `ag${round}a`, doneA = (async () => { await wait(5000); feed({ k: 'say', ag: agA, text: 'Heard, chef!' }); await crewRun(agA, [[R(f[2])], [G('redirect(')], [R(f[3])], [B('Lint it', 'npm run lint'), true], [E(f[2])], [W('supabase auth cookie path')]]); feed({ k: 'result', id: sync }); })();
      await tool(SK('frontend-design')); await tool(MCP('reticle', 'look'), 1500); await tool(E(f[3]));
      const async1 = 'd' + (++n); feed({ k: 'tool', id: async1, ...SPAWN(c.b) }); await wait(700); feed({ k: 'result', id: async1 }); feed({ k: 'bg', id: `ag${round}b`, agent: true, label: c.b });
      const agB = `ag${round}b`, doneB = (async () => { await wait(6000); await crewRun(agB, [[R(f[4])], [G('t(\'login')], [MCP('supabase', 'execute_sql')], [E(f[4])]]); feed({ k: 'bgdone', id: agB, status: 'completed' }); })();
      await tool({ name: 'SendMessage', cat: 'agent', label: 'message ' + agB }); await tool(B('Run the tests', 'npm test'), 1600);
      await doneA; await doneB; await wait(2500);
      feed({ k: 'ask', text: 'Claude needs your permission to use Bash' }); await wait(7000);
      await tool(B('Commit the fix', 'git add -A && git commit -m "fix: season the login"'), 1500);
      await tool(B('Push it', 'git push origin main'), 1500, burnt); // a rejected push 86's the order
      await tool(B('Check the log', 'git --no-pager log -1'));
      if (burnt) await tool(B('Push again', 'git push origin main'), 1400, true);
      feed({ k: 'say', text: burnt ? 'That one’s burnt. Scrape the pan, we go again tomorrow.' : 'Beautiful. Service!' }); await wait(1200);
      feed({ k: 'end' }); await wait(40000);
    }
  })();
}
