<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Ironworks</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07060c; --panel: rgba(10, 10, 18, .72); --line: rgba(255,255,255,.10);
    --text: #eef0ff; --dim: #8d92b3; --coral: #ff8a5c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; overflow: hidden; }
  #scene, #labels { position: fixed; inset: 0; }
  #labels { pointer-events: none; }
  .hud { position: fixed; z-index: 5; pointer-events: none; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #tl { top: 16px; left: 16px; max-width: min(420px, calc(100vw - 32px)); }
  .brand { font-weight: 800; letter-spacing: .3em; font-size: 11px; color: var(--coral); display: flex; align-items: center; gap: 8px; }
  .brand i { width: 8px; height: 8px; background: #555; display: inline-block; }
  .brand i.on { background: #7cff6b; box-shadow: 0 0 8px #7cff6b; }
  #qbtn { pointer-events: auto; margin-left: auto; font: inherit; font-size: 9.5px; letter-spacing: .15em; color: var(--text);
    background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 3px; padding: 4px 8px; cursor: pointer; }
  #qbtn:hover { background: rgba(255,255,255,.14); }
  #qbtn:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
  #cams { display: flex; gap: 4px; margin-top: 8px; }
  #ccPick { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 6px; }
  #ccPick[hidden] { display: none; }
  #ccPick button[aria-pressed="true"] { background: #7cff6b; border-color: #7cff6b; color: #15172a; font-weight: 800; }
  #freeHint { position: fixed; z-index: 4; top: 18px; left: 50%; transform: translateX(-50%); pointer-events: none; font-size: 11px; font-weight: 600; color: #dfe6ff; text-shadow: 0 1px 3px #000; white-space: nowrap; }
  #freeHint[hidden] { display: none; }
  #cams button, #ccPick button, #cctv button { pointer-events: auto; font: inherit; font-size: 9.5px; letter-spacing: .12em; color: var(--text); background: rgba(255,255,255,.06);
    border: 1px solid var(--line); border-radius: 3px; padding: 4px 8px; cursor: pointer; }
  #cams button:hover, #ccPick button:hover, #cctv button:hover { background: rgba(255,255,255,.14); }
  #cams button[aria-pressed="true"] { background: var(--coral); border-color: var(--coral); color: #15172a; font-weight: 800; }
  #cams button:focus-visible, #ccPick button:focus-visible, #cctv button:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
  #cctv { position: fixed; z-index: 4; top: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; pointer-events: none;
    font-size: 12px; font-weight: 600; color: #c9f5cf; text-shadow: 0 1px 3px #000; white-space: nowrap; }
  #cctv[hidden] { display: none; }
  #cctv .rec { color: #ff4d4d; animation: blink 1.2s steps(2) infinite; }
  #title { font-size: 15px; font-weight: 600; margin-top: 6px; }
  #sub { font-size: 11px; color: var(--dim); margin-top: 3px; }
  #tr { top: 16px; right: 16px; display: grid; grid-template-columns: repeat(5, auto); gap: 4px 18px; }
  .stat b { display: block; font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 9px; letter-spacing: .18em; color: var(--dim); text-transform: uppercase; }
  #limits { grid-column: 1 / -1; display: grid; gap: 6px; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 10px; color: var(--dim); }
  #limits[hidden] { display: none; }
  #limits .row { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; align-items: center; }
  #limits .bar { height: 6px; background: rgba(255,255,255,.08); border-radius: 1px; overflow: hidden; }
  #limits .bar i { display: block; height: 100%; background: #7cff6b; box-shadow: 0 0 6px currentColor; }
  #limits b { color: var(--text); font-variant-numeric: tabular-nums; }
  #feed { bottom: 16px; left: 16px; width: min(440px, calc(100vw - 32px)); font-size: 11.5px; }
  #feed div { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; white-space: nowrap; overflow: hidden; animation: in .35s steps(4); }
  #feed div:nth-child(n+4) { opacity: .6; } #feed div:nth-child(n+6) { opacity: .35; }
  #feed em { font-style: normal; width: 7px; height: 7px; flex: none; transform: translateY(-1px); }
  #feed small { color: var(--dim); margin-left: auto; padding-left: 8px; }
  #feed span { overflow: hidden; text-overflow: ellipsis; }
  @keyframes in { from { transform: translateX(-12px); opacity: 0; } }
  #now { bottom: 22px; left: 50%; transform: translateX(-50%); font-size: 13px; font-weight: 600; padding: 9px 16px;
    white-space: nowrap; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  #now em { display: inline-block; width: 9px; height: 9px; margin-right: 8px; background: var(--coral); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  #legend { bottom: 16px; right: 16px; display: flex; flex-direction: column; gap: 4px; font-size: 10.5px; color: var(--dim); }
  #legend div { display: flex; align-items: center; gap: 7px; }
  #legend em { width: 9px; height: 9px; }
  #tip { position: fixed; z-index: 6; pointer-events: none; font-size: 11px; padding: 7px 10px; display: none; }
  #tip b { display: block; font-size: 12px; margin-bottom: 2px; }
  .sign { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 3px; background: rgba(8,8,14,.82);
    border: 1px solid; white-space: nowrap; color: #fff; }
  .file-label { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: rgba(8,9,18,.85); border-left: 3px solid;
    white-space: nowrap; opacity: 0; transition: opacity .4s; color: #fff; }
  .file-label.on { opacity: 1; }
  .bot-name { font-size: 9.5px; font-weight: 600; color: #ffd166; white-space: nowrap; text-shadow: 0 1px 2px #000; }
  .bubble { font-size: 11px; font-weight: 600; color: #15172a; background: #fff8ef; padding: 5px 9px; border-radius: 4px;
    box-shadow: 0 4px 14px rgba(0,0,0,.55); max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity .25s; }
  .bubble.on { opacity: 1; }
  .float { font-size: 12px; font-weight: 800; white-space: nowrap; text-shadow: 0 1px 3px #000; max-width: 380px; overflow: hidden; text-overflow: ellipsis; }
  .float.big { font-size: 14px; color: #fff; background: rgba(10,12,24,.8); padding: 4px 10px; border: 1px solid #fff; border-radius: 4px; text-shadow: none; }
  @media (prefers-reduced-motion: reduce) { #feed div, #now em, #cctv .rec { animation: none; } }
  @media (max-width: 900px) { #legend, #now { display: none; } #tr { grid-template-columns: repeat(3, auto); top: auto; bottom: 200px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<body>
<div id="scene"></div>
<div id="labels"></div>

<div class="hud panel" id="tl">
  <div class="brand"><i id="dot"></i>CLAUDE IRONWORKS<button id="qbtn" type="button" aria-label="Toggle render quality">HIGH</button></div>
  <div id="title">Waiting for a session…</div>
  <div id="sub">—</div>
  <div id="cams" role="group" aria-label="Camera mode">
    <button type="button" data-cam="orbit" title="Key 1">1 ORBIT</button>
    <button type="button" data-cam="follow" title="Key 2. Drag to rotate, scroll to zoom; the view stays put. Press again to go back behind the robot">2 FOLLOW</button>
    <button type="button" data-cam="cctv" title="Key 3: pick a camera">3 CCTV</button>
    <button type="button" data-cam="free" title="Key 4">4 FREE</button>
    <button type="button" id="crewBtn" aria-pressed="false" title="Key C: seat a sample crew at the table">CREW</button>
  </div>
  <div id="ccPick" role="group" aria-label="Choose a CCTV camera" hidden></div>
</div>
<div id="freeHint" hidden>WASD move · drag to look · E / Q up / down · Shift faster · scroll sets speed</div>
<div id="cctv" hidden>
  <button type="button" id="ccPrev" aria-label="Previous camera">‹</button>
  <span id="ccName"></span><span class="rec">● REC</span><span id="ccTime"></span>
  <button type="button" id="ccNext" aria-label="Next camera">›</button>
</div>
<div class="hud panel" id="tr">
  <div class="stat"><b id="sTok">0</b><span>tokens out</span></div>
  <div class="stat"><b id="sTools">0</b><span>tool calls</span></div>
  <div class="stat"><b id="sFiles">0</b><span>files</span></div>
  <div class="stat"><b id="sEdits">0</b><span>edits</span></div>
  <div class="stat"><b id="sCost">—</b><span>est. cost</span></div>
  <div id="limits" hidden></div>
</div>
<div class="hud panel" id="feed"></div>
<div class="hud panel" id="now"><em></em><span>idle</span></div>
<div class="hud panel" id="legend"></div>
<div class="panel" id="tip"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { HorizontalTiltShiftShader } from 'three/addons/shaders/HorizontalTiltShiftShader.js';
import { VerticalTiltShiftShader } from 'three/addons/shaders/VerticalTiltShiftShader.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = s => document.querySelector(s);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const CAT = {
  read:   { c: 0x4cc9f0, n: 'read · scan drive' },
  edit:   { c: 0xff8c42, n: 'edit · pull & repair drive' },
  shell:  { c: 0x7cff6b, n: 'shell · terminal' },
  search: { c: 0xb388ff, n: 'search · radar' },
  web:    { c: 0xff5fa2, n: 'web · radio tower' },
  agent:  { c: 0xffd166, n: 'subagent · worker bot' },
  other:  { c: 0xdfe6ff, n: 'other / mcp · console' },
};
const hex = n => '#' + n.toString(16).padStart(6, '0');
const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const damp = (a, b, k, dt) => a + (b - a) * Math.min(1, dt * k);
const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
const rand = (a, b) => a + Math.random() * (b - a);
$('#legend').innerHTML = Object.values(CAT).map(v => `<div><em style="background:${hex(v.c)}"></em>${v.n}</div>`).join('');
let HQ = true;
try { HQ = localStorage.getItem('orbit-quality') !== 'low'; } catch {}

// ---------- renderer / camera / post ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(HQ ? Math.min(devicePixelRatio, 2) : 1);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false; // redrawn a few times a second from the loop, not every frame
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
$('#scene').appendChild(renderer.domElement);
RectAreaLightUniformsLib.init();
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
$('#labels').appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x101420, .0028);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, .5, 1400);
camera.position.set(38, 27, 38).multiplyScalar(innerWidth < innerHeight ? 1.15 : 1).add(new THREE.Vector3(0, 0, 4));
let camMode = 'orbit';
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 4);
controls.enableDamping = true; controls.autoRotate = !CALM; controls.autoRotateSpeed = .25;
// Outer skyline towers start at r >= 105, beyond the farthest the camera can orbit, so they never block the roof.
controls.minDistance = 22; controls.maxDistance = 100; controls.maxPolarAngle = 1.32; controls.minPolarAngle = .25;
let userUntil = 0;
controls.addEventListener('start', () => { controls.autoRotate = false; userUntil = 0; });
controls.addEventListener('end', () => { userUntil = performance.now() + 7000; });

// HDR target without MSAA: UnrealBloomPass outputs black on a multisampled target in r160, so edges get SMAA instead
const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
gtao.updateGtaoMaterial({ radius: .9, distanceExponent: 2, thickness: 1.2, scale: 1, samples: 16 });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
// Rain, beams and glow particles would print dark AO smudges: hide transparent and glow meshes from its depth pass.
{
  const ov = gtao.overrideVisibility.bind(gtao);
  gtao.overrideVisibility = () => { ov(); scene.traverse(o => { if (o.isMesh && (o.material.transparent || o.userData.noAO)) o.visible = false; }); };
}
composer.addPass(gtao);
// Bloom smears any NaN/Inf/negative pixel into a black square: zero bad pixels and clamp the range first.
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
    // Direct3D (ANGLE on Windows) strips isnan checks, but its min/max return the non-NaN operand, so clamping alone cleans NaN and Inf.
    void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb; gl_FragColor = vec4(min(max(c, vec3(0.)), vec3(48.)), 1.); }`,
}));
// Only true light sources (HDR > 1) bloom, and softly: no glare when the camera faces a lamp.
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .32, .35, 1.0);
composer.addPass(bloom);
const tiltH = new ShaderPass(HorizontalTiltShiftShader), tiltV = new ShaderPass(VerticalTiltShiftShader);
tiltH.uniforms.r.value = tiltV.uniforms.r.value = .52;
composer.addPass(tiltH); composer.addPass(tiltV);
composer.addPass(new OutputPass());
composer.addPass(new SMAAPass(innerWidth * renderer.getPixelRatio(), innerHeight * renderer.getPixelRatio()));
// film look after tone mapping: vignette, faint grain, cool shadows
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, cctv: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time; uniform float cctv; varying vec2 vUv;
    float rnd(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec3 col = texture2D(tDiffuse, vUv).rgb;
      float l = dot(col, vec3(.299, .587, .114));
      col = mix(col * vec3(.92, 1.0, 1.07), col, smoothstep(.0, .6, l));
      vec2 c = vUv - .5; col *= 1. - dot(c, c) * .9;
      if (cctv > .5) { float g = dot(col, vec3(.3, .59, .11)); col = mix(col, vec3(g * .82, g * 1.05, g * .86), .75); col *= .93 + .07 * sin(vUv.y * 720. + time * 30.); }
      col += (rnd(vUv * 900. + fract(time)) - .5) * (cctv > .5 ? .07 : 0.);
      gl_FragColor = vec4(col, 1.);
    }`,
});
composer.addPass(grade);
function applyQuality() {
  const pr = HQ ? Math.min(devicePixelRatio, 2) : 1;
  renderer.setPixelRatio(pr); composer.setPixelRatio(pr);
  gtao.enabled = HQ; tiltH.enabled = tiltV.enabled = HQ && camMode === 'orbit'; // miniature blur would smear the close-up cameras
  tiltH.uniforms.h.value = 3 / innerWidth; tiltV.uniforms.v.value = 3 / innerHeight;
  for (const l of shadowLights) { const s = HQ ? l.userData.hq : l.userData.lq; l.castShadow = s > 0; if (s) { l.shadow.mapSize.set(s, s); l.shadow.map?.dispose(); l.shadow.map = null; } }
  if (city.rain) city.rain.count = HQ ? city.rainData.length : Math.floor(city.rainData.length / 3);
  $('#qbtn').textContent = HQ ? 'HIGH' : 'LOW';
  $('#qbtn').setAttribute('aria-pressed', String(HQ));
}
$('#qbtn').addEventListener('click', () => {
  HQ = !HQ; try { localStorage.setItem('orbit-quality', HQ ? 'high' : 'low'); } catch {}
  applyQuality();
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  tiltH.uniforms.h.value = 3 / innerWidth; tiltV.uniforms.v.value = 3 / innerHeight;
});

// ---------- procedural PBR textures (tileable, generated once) ----------
function hash2(x, y) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y, px, py) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const x0 = ((xi % px) + px) % px, y0 = ((yi % py) + py) % py, x1 = (x0 + 1) % px, y1 = (y0 + 1) % py;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(x0, y0), b = hash2(x1, y0), c = hash2(x0, y1), d = hash2(x1, y1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
// u, v in [0,1); fx, fy integer base frequencies keep it tileable
function fbm(u, v, fx, fy, oct = 4) { let s = 0, a = .5, n = 0; for (let i = 0; i < oct; i++) { s += a * vnoise(u * fx, v * fy, fx, fy); n += a; fx *= 2; fy *= 2; a *= .5; } return s / n; }
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function genTex(size, fn, ns = 3) {
  const H = new Float32Array(size * size), A = new Uint8Array(size * size * 4), R = new Uint8Array(size * size * 4), N = new Uint8Array(size * size * 4);
  const o = { h: 0, r: .5, cr: 1, cg: 1, cb: 1 };
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    o.h = 0; o.r = .5; o.cr = o.cg = o.cb = 1;
    fn(x / size, y / size, o);
    const i = y * size + x, j = i * 4; H[i] = o.h;
    A[j] = Math.min(255, o.cr * 255); A[j + 1] = Math.min(255, o.cg * 255); A[j + 2] = Math.min(255, o.cb * 255); A[j + 3] = 255;
    R[j] = R[j + 1] = R[j + 2] = Math.min(255, Math.max(0, o.r * 255)); R[j + 3] = 255;
  }
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const l = H[y * size + (x - 1 + size) % size], r = H[y * size + (x + 1) % size];
    const dn = H[((y - 1 + size) % size) * size + x], up = H[((y + 1) % size) * size + x];
    const nx = (l - r) * ns, ny = (dn - up) * ns, len = Math.hypot(nx, ny, 1), j = (y * size + x) * 4;
    N[j] = (nx / len * .5 + .5) * 255; N[j + 1] = (ny / len * .5 + .5) * 255; N[j + 2] = (1 / len * .5 + .5) * 255; N[j + 3] = 255;
  }
  const mk = (data, srgb) => {
    const t = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter;
    t.generateMipmaps = true; t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.needsUpdate = true; return t;
  };
  return { map: mk(A, true), rough: mk(R), normal: mk(N) };
}
// clean factory finish: smooth, even paint with no seams, wear or stains (albedo is a grey layer tinted by material.color)
const TX = {};
TX.metal = genTex(64, (u, v, o) => { o.h = 0; o.r = .42; o.cr = o.cg = o.cb = .8; });
// roof surface: smooth poured slabs with fine joints
TX.concrete = genTex(1024, (u, v, o) => {
  const S = 6, su = u * S % 1, sv = v * S % 1, j = Math.min(su, 1 - su, sv, 1 - sv);
  let c = .44, h = 0; if (j < .002) { h = -.3; c *= .8; }
  o.h = h; o.r = .6; o.cr = c * .98; o.cg = c; o.cb = c * 1.03;
}, 2);
TX.rubber = genTex(256, (u, v, o) => {
  const c = .14 + fbm(u, v, 16, 16, 3) * .06;
  o.h = fbm(u, v, 64, 64, 2) * .3; o.r = .85; o.cr = o.cg = o.cb = c;
